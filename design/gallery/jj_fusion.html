<title>Maquette Claudemètre v28</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=Barlow:wght@400;500&display=swap">
<style>
/* Mise en page : banc d'instrument. Grande scène à gauche, rack des vues à droite, plaquette et relevé au-dessus.
   Un seul thème, celui de la platine noire. Couleurs reprises de l'objet et du firmware. */
:root {
  color-scheme: dark;
  --platine: #141311;
  --plaque: #1e1d19;
  --trait: #38362e;
  --blanc: #eceae2;      /* PLA blanc des plaquettes */
  --gris: #aaa698;
  --kaki: #8f9660;       /* kaki éclairci pour se lire sur le noir */
  --segment: #ffba18;    /* segments du TM1637 */
  --ambre: #ff8f1f;      /* firmware : 100 / 56 / 12 % */
  --rouge: #ff4a33;      /* firmware : 100 / 16 / 8 %, éclairci pour le texte */
  --titre: "Barlow Semi Condensed", "Arial Narrow", sans-serif;
  --texte: "Barlow", "Segoe UI", system-ui, sans-serif;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body {
  background: var(--platine); color: var(--blanc); font: 16px/1.5 var(--texte);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 32px;
}
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 20px; }

header { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 32px; }
.plaquette {
  display: flex; align-items: center; gap: 16px; padding: 10px 14px; background: var(--plaque);
  border: 1px solid var(--trait); border-radius: 5px;
}
.vis { width: 15px; height: 15px; border-radius: 50%; flex: none; background: radial-gradient(circle, #000 0 30%, #2c2b27 34% 100%); }
h1 { font: 500 clamp(22px, 3vw, 30px)/1 var(--titre); letter-spacing: .14em; margin: 0; }
.releve { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; margin: 0 0 0 auto; }
.releve div { display: grid; gap: 2px; }
.releve dt { font: 500 12px/1 var(--titre); letter-spacing: .12em; color: var(--gris); }
.releve dd { margin: 0; font: 500 26px/1 var(--titre); font-variant-numeric: tabular-nums; }
.releve dd small { font-size: 13px; color: var(--gris); letter-spacing: .04em; margin-left: 4px; }
.sept { display: block; height: 26px; width: auto; fill: var(--segment); }

.banc { display: grid; grid-template-columns: minmax(0, 1fr) 216px; gap: 16px; }
.scene-col { display: grid; gap: 12px; min-width: 0; align-content: start; }
figure { margin: 0; display: grid; gap: 8px; }
.scene { aspect-ratio: 3 / 2; max-width: 100%; background: #000; border: 1px solid var(--trait); border-radius: 4px; overflow: hidden; }
.scene video, .scene img { display: block; width: 100%; height: 100%; object-fit: cover; }
figcaption { color: var(--gris); font-size: 14px; }

.sequence { position: relative; display: flex; gap: 2px; }
.etat {
  min-width: 0; padding: 8px 12px 10px; display: grid; gap: 1px; text-align: left; cursor: pointer;
  background: var(--plaque); color: var(--blanc); border: 0; border-top: 3px solid var(--couleur); font: 14px/1.3 var(--texte);
}
.etat b { font: 600 14px/1.2 var(--titre); letter-spacing: .1em; color: var(--couleur); }
.etat span { color: var(--gris); }
.etat.ambre { --couleur: var(--ambre); flex: 6.4 1 0; }
.etat.rouge { --couleur: var(--rouge); flex: 3 1 0; }
.etat.actif { background: #2a2822; }
.etat:focus-visible, .vue:focus-visible { outline: 2px solid var(--segment); outline-offset: 1px; }
.tete { position: absolute; top: -3px; left: 0; width: 2px; height: 9px; background: var(--blanc); pointer-events: none; }

.rack { display: grid; gap: 10px; align-content: space-between; }
.vue {
  display: grid; gap: 5px; padding: 0 0 6px; background: none; border: 0; color: var(--gris); cursor: pointer;
  text-align: left; font: 500 14px/1.2 var(--titre); letter-spacing: .05em;
}
.vue img { display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; object-fit: cover; border: 1px solid var(--trait); border-radius: 3px; }
.vue:hover { color: var(--blanc); }
.vue[aria-pressed="true"] { color: var(--segment); }
.vue[aria-pressed="true"] img { border-color: var(--segment); }

footer { color: var(--gris); font-size: 14px; max-width: 78ch; margin: 0; }
footer strong { color: var(--blanc); font-weight: 500; }

@media (max-width: 820px) {
  .banc { grid-template-columns: minmax(0, 1fr); }
  .rack { grid-template-columns: 1fr 1fr; }
  .releve { margin-left: 0; }
}
@media (max-width: 460px) {
  .etat { padding-inline: 8px; }
  .etat span { font-size: 13px; }
}
</style>

<div class="wrap">
  <header>
    <div class="plaquette"><span class="vis"></span><h1>CLAUDEMÈTRE</h1><span class="vis"></span></div>
    <dl class="releve" aria-label="Valeurs d'exemple de la maquette">
      <div><dt>SESSION</dt><dd>62<small>% · 5 H</small></dd></div>
      <div><dt>SEMAINE</dt><dd>38<small>% · 7 J</small></dd></div>
      <div>
        <dt>RÉINIT.</dt>
        <dd>
          <svg class="sept" viewBox="-14 0 358 104" role="img" aria-label="14:32">
            <defs>
              <polygon id="sa" points="10,2 50,2 56,8 50,14 10,14 4,8"/>
              <polygon id="sb" points="56,10 62,16 62,42 56,48 50,42 50,16"/>
              <polygon id="sc" points="56,56 62,62 62,88 56,94 50,88 50,62"/>
              <polygon id="sd" points="10,90 50,90 56,96 50,102 10,102 4,96"/>
              <polygon id="se" points="4,56 10,62 10,88 4,94 -2,88 -2,62"/>
              <polygon id="sf" points="4,10 10,16 10,42 4,48 -2,42 -2,16"/>
              <polygon id="sg" points="10,46 50,46 56,52 50,58 10,58 4,52"/>
            </defs>
            <g transform="skewX(-5) translate(10 0)">
              <g><use href="#sb"/><use href="#sc"/></g>
              <g transform="translate(84 0)"><use href="#sf"/><use href="#sg"/><use href="#sb"/><use href="#sc"/></g>
              <circle cx="166" cy="32" r="6"/><circle cx="166" cy="72" r="6"/>
              <g transform="translate(190 0)"><use href="#sa"/><use href="#sb"/><use href="#sg"/><use href="#sc"/><use href="#sd"/></g>
              <g transform="translate(274 0)"><use href="#sa"/><use href="#sb"/><use href="#sg"/><use href="#se"/><use href="#sd"/></g>
            </g>
          </svg>
        </dd>
      </div>
    </dl>
  </header>

  <main class="banc">
    <div class="scene-col">
      <figure>
        <div class="scene">
          <video id="film" src="img/jj_fusion_soir.mp4" poster="img/jj_fusion_soir.jpg" autoplay loop muted playsinline controls width="1500" height="1000" aria-label="Le soir : la légende CLAUDE respire en ambre, puis clignote en rouge"></video>
          <img id="photo" alt="" width="1500" height="1000" hidden>
        </div>
        <figcaption id="legende">Le soir, voyant animé au rythme du firmware.</figcaption>
      </figure>
      <div class="sequence" role="group" aria-label="Séquence du voyant, 9,4 s en boucle">
        <button class="etat ambre actif" type="button" data-t="0"><b>AMBRE</b><span>Un agent travaille : respiration de 3,2 s, 100 → 35 → 100 %</span></button>
        <button class="etat rouge" type="button" data-t="6.4"><b>ROUGE</b><span>Un agent attend une réponse : 1 Hz</span></button>
        <span class="tete" id="tete" aria-hidden="true"></span>
      </div>
    </div>

    <nav class="rack" aria-label="Vues de la maquette">
      <button class="vue" type="button" aria-pressed="true" data-cap="Le soir, voyant animé au rythme du firmware."><img src="img/jj_fusion_soir.jpg" alt="" width="1500" height="1000">Le soir, voyant animé</button>
      <button class="vue" type="button" aria-pressed="false" data-src="img/jj_fusion.jpg" data-cap="Trois quarts : le connecteur regarde 30° vers le haut, le câble passe par-dessus et tombe le long de la planche." data-alt="Boîtier kaki de trois quarts sur la planche, fiche branchée sur le coin incliné, câble qui tombe le long du bois"><img src="img/jj_fusion.jpg" alt="" width="1500" height="1000" loading="lazy">Trois quarts</button>
      <button class="vue" type="button" aria-pressed="false" data-src="img/jj_fusion_face.jpg" data-cap="De face, en journée : cadrans à 62 et 38 %, afficheur à 14:32, légende CLAUDE en ambre." data-alt="Façade de jour : deux cadrans, afficheur 14:32, légende CLAUDE ambre, fiche à droite"><img src="img/jj_fusion_face.jpg" alt="" width="1500" height="1000" loading="lazy">De face</button>
      <button class="vue" type="button" aria-pressed="false" data-src="img/jj_fusion_detail.jpg" data-cap="plaque_bossage : plaque de flanc kaki, fiche LP-16 branchée, 4 vis de plaque." data-alt="Gros plan du flanc droit : coin incliné à 30°, fiche noire vers le haut, câble en boucle"><img src="img/jj_fusion_detail.jpg" alt="" width="1500" height="1000" loading="lazy">Connecteur</button>
    </nav>
  </main>

  <footer>
    <strong>Boîtier de 200 × 96 × 40 mm</strong>, rendu d'après le design Fusion <code>claudometre</code>, version 28. Aiguilles, vitres, équipage mobile, fiche LP-16 et câble sont ajoutés pour le rendu. Les valeurs affichées sont des exemples.
  </footer>
</div>

<script>
const DUREE = 9.4;
const film = document.getElementById("film");
const photo = document.getElementById("photo");
const legende = document.getElementById("legende");
const tete = document.getElementById("tete");
const vues = [...document.querySelectorAll(".vue")];
const etats = [...document.querySelectorAll(".etat")];
const calme = matchMedia("(prefers-reduced-motion: reduce)").matches;

function montre(vue) {
  for (const v of vues) v.setAttribute("aria-pressed", String(v === vue));
  legende.textContent = vue.dataset.cap;
  if (vue.dataset.src) {
    film.pause();
    film.hidden = true;
    photo.src = vue.dataset.src;
    photo.alt = vue.dataset.alt;
    photo.hidden = false;
  } else {
    photo.hidden = true;
    film.hidden = false;
    film.play().catch(() => {});
  }
}

function suit() {
  const t = film.currentTime || 0;
  tete.style.left = `${(t / DUREE) * 100}%`;
  etats[0].classList.toggle("actif", t < 6.4);
  etats[1].classList.toggle("actif", t >= 6.4);
  if (!film.paused) requestAnimationFrame(suit);
}

for (const v of vues) v.addEventListener("click", () => montre(v));
for (const e of etats) {
  e.addEventListener("click", () => {
    montre(vues[0]);
    film.currentTime = Number(e.dataset.t);
    suit();
  });
}
film.addEventListener("play", suit);
film.addEventListener("seeked", suit);
if (calme) {
  film.removeAttribute("autoplay");
  film.pause();
}
</script>
