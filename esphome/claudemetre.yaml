# Claudemètre : firmware ESPHome.
# Lit les capteurs claude_* de Home Assistant (homeassistant/packages/claudemetre.yaml)
# et les montre sur deux voltmètres SO-45 (PWM), un TM1637 (heure de reset de
# la session ou temps restant, au choix depuis HA) et le voyant CLAUDE (ruban
# WS2812B, paquet temoin.yaml).
# Spécification : docs/cahier-des-charges.md § 3 ; détail : docs/logiciel.md.
#
# Carte : diymore ESP32-S3-DevKitC-1 N16R8 (16 Mo de flash ; PSRAM octale
# inutilisée, mais GPIO33-37 pris). Broches, sur le connecteur
# de gauche :
#   GPIO4   jauge session : + du SO-45 A (− à GND)
#   GPIO5   jauge semaine : + du SO-45 B (− à GND)
#   GPIO6   TM1637 CLK (VCC en 3V3)
#   GPIO7   TM1637 DIO
#   GPIO14  DIN du ruban du voyant (voir temoin.yaml)
#
# Valider et compiler avec le skill esphome (esph.sh config / compile).

esphome:
  name: claudemetre
  friendly_name: Claudemètre
  on_boot:
    priority: -100
    then:
      - script.execute: boot_test

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption: {}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

packages:
  lamp: !include
    file: temoin.yaml
    vars:
      id: lamp
      name: Voyant
      pin: GPIO14
      led_count: 4 # ruban à 144 LED/m derrière la fenêtre de 32 mm

time:
  - platform: homeassistant
    id: ha_time
    timezone: Europe/Paris

# Données de Home Assistant. Usage inconnu = NaN (ce n'est pas 0 %).
sensor:
  - platform: homeassistant
    id: session_used
    entity_id: sensor.claude_usage_session
  - platform: homeassistant
    id: week_used
    entity_id: sensor.claude_usage_semaine

# Heures de reset en epoch, lues comme texte (un float 32 bits ne garde un
# epoch qu'à 128 s près) ; « None » ou vide = inconnue.
text_sensor:
  - platform: homeassistant
    id: session_resets_at
    entity_id: sensor.claude_reset_session
    attribute: epoch
  - platform: homeassistant
    id: week_resets_at
    entity_id: sensor.claude_reset_semaine
    attribute: epoch

binary_sensor:
  - platform: homeassistant
    id: claude_active
    entity_id: binary_sensor.claude_actif
    on_state:
      - script.execute: lamp_update
  - platform: homeassistant
    id: claude_attention
    entity_id: binary_sensor.claude_needattention
    on_state:
      - script.execute: lamp_update

globals:
  # % imposé à chaque jauge (test du démarrage, réglage) ; négatif = suivre HA.
  - id: session_forced
    type: float
    initial_value: "-1"
  - id: week_forced
    type: float
    initial_value: "-1"
  # Rapport cyclique actuel de chaque jauge (0-1), qui glisse vers sa cible.
  - id: session_duty
    type: float
    initial_value: "0"
  - id: week_duty
    type: float
    initial_value: "0"
  - id: boot_testing
    type: bool
    initial_value: "true"
  # Début de l'animation du démarrage (millis).
  - id: boot_start
    type: uint32_t
    initial_value: "0"
  # Reset de la session guetté tant qu'il est à venir ; 0 = aucun.
  - id: reset_armed
    type: time_t
    initial_value: "0"
  # Reset qui vient de passer, et images de clignotement qu'il reste à montrer.
  - id: reset_passed
    type: time_t
    initial_value: "0"
  - id: reset_blink_left
    type: int
    initial_value: "0"

# PWM au-dessus de l'audible : le cadre mobile en fait la moyenne.
output:
  - platform: ledc
    id: session_pwm
    pin: GPIO4
    frequency: 25kHz
  - platform: ledc
    id: week_pwm
    pin: GPIO5
    frequency: 25kHz

# Étalonnage : rapport cyclique (%) qui met l'aiguille sur 0, 25, 50, 75 et
# 100 % du cadran, interpolé entre ces points. Valeurs de départ : droite
# jusqu'à 89 % (100 % imprimé vers 2,94 V avec la 6,2 kΩ, sur 3,3 V). Le 0 %
# est un petit rapport cyclique : au repos, l'aiguille est un peu sous le 0 %
# imprimé (vis du zéro). Changer un point amène la jauge dessus pendant 20 s,
# pour le régler à l'œil.
.cal: &cal
  platform: template
  icon: mdi:tune-vertical
  entity_category: config
  unit_of_measurement: "%"
  mode: box
  min_value: 0
  max_value: 100
  step: 0.1
  optimistic: true
  restore_value: true

number:
  - <<: *cal
    id: session_cal_0
    name: Jauge session 0 %
    initial_value: 0
    set_action:
      - lambda: id(session_forced) = 0;
      - script.execute: session_preview
  - <<: *cal
    id: session_cal_25
    name: Jauge session 25 %
    initial_value: 22.3
    set_action:
      - lambda: id(session_forced) = 25;
      - script.execute: session_preview
  - <<: *cal
    id: session_cal_50
    name: Jauge session 50 %
    initial_value: 44.5
    set_action:
      - lambda: id(session_forced) = 50;
      - script.execute: session_preview
  - <<: *cal
    id: session_cal_75
    name: Jauge session 75 %
    initial_value: 66.8
    set_action:
      - lambda: id(session_forced) = 75;
      - script.execute: session_preview
  - <<: *cal
    id: session_cal_100
    name: Jauge session 100 %
    initial_value: 89
    set_action:
      - lambda: id(session_forced) = 100;
      - script.execute: session_preview
  - <<: *cal
    id: week_cal_0
    name: Jauge semaine 0 %
    initial_value: 0
    set_action:
      - lambda: id(week_forced) = 0;
      - script.execute: week_preview
  - <<: *cal
    id: week_cal_25
    name: Jauge semaine 25 %
    initial_value: 22.3
    set_action:
      - lambda: id(week_forced) = 25;
      - script.execute: week_preview
  - <<: *cal
    id: week_cal_50
    name: Jauge semaine 50 %
    initial_value: 44.5
    set_action:
      - lambda: id(week_forced) = 50;
      - script.execute: week_preview
  - <<: *cal
    id: week_cal_75
    name: Jauge semaine 75 %
    initial_value: 66.8
    set_action:
      - lambda: id(week_forced) = 75;
      - script.execute: week_preview
  - <<: *cal
    id: week_cal_100
    name: Jauge semaine 100 %
    initial_value: 89
    set_action:
      - lambda: id(week_forced) = 100;
      - script.execute: week_preview

  - platform: template
    id: display_brightness
    name: Afficheur luminosité
    icon: mdi:brightness-6
    entity_category: config
    mode: slider
    min_value: 0
    max_value: 7
    step: 1
    initial_value: 4
    optimistic: true
    restore_value: true

select:
  - platform: template
    id: display_mode
    name: Afficheur mode
    icon: mdi:clock-outline
    entity_category: config
    options:
      - Heure de reset
      - Temps restant
    initial_option: Heure de reset
    optimistic: true
    restore_value: true

interval:
  - interval: 20ms
    then:
      - lambda: |-
          // Cible de chaque jauge, en rapport cyclique (0-1) :
          // - % imposé (test du démarrage, réglage) ;
          // - usage inconnu : 0, aiguille au repos sous le 0 % imprimé ;
          // - heure de reset passée : 0 %, sans attendre le PC ;
          // - sinon l'usage, par la table d'étalonnage.
          const auto now = id(ha_time).now();
          auto target = [&](float forced, float used, const std::string &resets_at, const float cal[5]) -> float {
            float pct = forced;
            if (pct < 0) {
              if (std::isnan(used))
                return 0.0f;
              const time_t reset = atoll(resets_at.c_str());
              pct = (now.is_valid() && reset > 0 && now.timestamp >= reset) ? 0.0f : used;
            }
            pct = std::clamp(pct, 0.0f, 100.0f);
            const int k = std::min(int(pct / 25), 3);
            const float f = (pct - 25 * k) / 25;
            return (cal[k] + f * (cal[k + 1] - cal[k])) / 100;
          };
          // Glissement à vitesse limitée, pour un rendu mécanique : pleine
          // échelle en ≈ 2,5 s.
          auto glide = [](float &duty, float target, output::FloatOutput *out) {
            const float step = 0.4f * 0.020f;
            if (duty == target)
              return;
            duty = fabsf(target - duty) <= step ? target : duty + (target > duty ? step : -step);
            out->set_level(duty);
          };
          const float session_cal[5] = {id(session_cal_0).state, id(session_cal_25).state, id(session_cal_50).state,
                                        id(session_cal_75).state, id(session_cal_100).state};
          const float week_cal[5] = {id(week_cal_0).state, id(week_cal_25).state, id(week_cal_50).state,
                                     id(week_cal_75).state, id(week_cal_100).state};
          glide(id(session_duty),
                target(id(session_forced), id(session_used).state, id(session_resets_at).state, session_cal),
                id(session_pwm));
          glide(id(week_duty), target(id(week_forced), id(week_used).state, id(week_resets_at).state, week_cal),
                id(week_pwm));

  # Animation du démarrage : 12 images par seconde, le temps du test. Une image
  # bloque l'ESP32 environ 26 ms : pas de cette cadence le reste du temps.
  - interval: 80ms
    then:
      - if:
          condition:
            lambda: return id(boot_testing);
          then:
            - component.update: tm_display

  # Reset de la session atteint pendant que l'appareil tourne : 25 images de
  # 200 ms, soit 5 s de clignotement. Rien au redémarrage sur un reset déjà passé.
  - interval: 200ms
    then:
      - lambda: |-
          if (id(reset_blink_left) > 0) {
            id(reset_blink_left)--;
            id(tm_display).update();
            return;
          }
          const auto now = id(ha_time).now();
          if (!now.is_valid())
            return;
          const time_t reset = atoll(id(session_resets_at).state.c_str());
          if (reset > now.timestamp) {
            id(reset_armed) = reset;
          } else if (id(reset_armed) != 0 && id(reset_armed) <= now.timestamp) {
            id(reset_passed) = id(reset_armed);
            id(reset_armed) = 0;
            id(reset_blink_left) = 25;
            id(tm_display).update();
          }

# Reset de la session, selon display_mode : heure (HH.MM) ou temps restant
# (-H.MM, 5 h au plus). Point du 2e chiffre qui clignote ; --.-- si
# l'heure est inconnue ou passée. Le test du démarrage et le clignotement du
# reset passent avant.
display:
  - platform: tm1637
    id: tm_display
    clk_pin: GPIO6
    dio_pin: GPIO7
    length: 4
    update_interval: 500ms
    lambda: |-
      it.set_intensity(uint8_t(id(display_brightness).state));
      if (id(boot_testing)) {
        // Tour de piste : un trait fait le tour et s'allonge jusqu'à fermer le
        // pourtour à la fin du test.
        const uint32_t t = millis() - id(boot_start);
        // Pourtour : chiffre, segment (1 = a, 2 = b, 4 = c, 8 = d, 16 = e, 32 = f).
        static const uint8_t ring[12][2] = {{0, 1}, {1, 1}, {2, 1}, {3, 1}, {3, 2},  {3, 4},
                                            {3, 8}, {2, 8}, {1, 8}, {0, 8}, {0, 16}, {0, 32}};
        uint8_t segments[4] = {0, 0, 0, 0};
        const int head = t / 80, length = std::min(12, 3 + int(t / 650));
        for (int i = 0; i < length; i++) {
          const uint8_t *step = ring[(head - i + 12) % 12];
          segments[step[0]] |= step[1];
        }
        it.set_buffer(segments, 4);
        return;
      }
      if (id(reset_blink_left) > 0) {
        // Dernière valeur affichée, à pleine luminosité, une image sur deux.
        it.set_intensity(7);
        if (id(reset_blink_left) % 2 == 0)
          return;
        if (id(display_mode).current_option() == "Temps restant")
          it.print("-0.01");
        else
          it.strftime("%H.%M", ESPTime::from_epoch_local(id(reset_passed)));
        return;
      }
      const auto now = id(ha_time).now();
      const time_t reset = atoll(id(session_resets_at).state.c_str());
      if (!now.is_valid() || reset <= now.timestamp) {
        it.print("--.--");
        return;
      }
      const bool dot = millis() % 1000 < 500;
      if (id(display_mode).current_option() == "Temps restant") {
        // Arrondi à la minute supérieure : -0.01 jusqu'au reset, jamais -0.00.
        const int minutes = (reset - now.timestamp + 59) / 60;
        it.printf(dot ? "-%d.%02d" : "-%d%02d", minutes / 60, minutes % 60);
      } else {
        it.strftime(dot ? "%H.%M" : "%H%M", ESPTime::from_epoch_local(reset));
      }

script:
  # Démarrage : aiguilles 0 → 100 → 0 %, tour de piste sur l'afficheur, voyant
  # ambre puis rouge ; ensuite tout suit Home Assistant (--.-- jusqu'aux
  # premières données).
  - id: boot_test
    then:
      - lambda: |-
          id(boot_testing) = true;
          id(boot_start) = millis();
          id(session_forced) = 100;
          id(week_forced) = 100;
      - light.turn_on:
          id: lamp
          red: 100%
          green: 56%
          blue: 12%
          effect: Fixe
      - delay: 3s
      - lambda: |-
          id(session_forced) = 0;
          id(week_forced) = 0;
      - light.turn_on:
          id: lamp
          red: 100%
          green: 16%
          blue: 8%
          effect: Fixe
      - delay: 3s
      - lambda: |-
          id(boot_testing) = false;
          id(session_forced) = -1;
          id(week_forced) = -1;
      - component.update: tm_display
      - script.execute: lamp_update

  # Fin du réglage d'un point d'étalonnage : la jauge revient aux données.
  - id: session_preview
    mode: restart
    then:
      - delay: 20s
      - lambda: id(session_forced) = -1;
  - id: week_preview
    mode: restart
    then:
      - delay: 20s
      - lambda: id(week_forced) = -1;

  # Voyant : rouge qui clignote si un agent attend une réponse (prioritaire),
  # ambre qui respire si au moins un agent travaille, éteint sinon. Couleurs
  # de la carte Lovelace.
  - id: lamp_update
    mode: restart
    then:
      - if:
          condition:
            lambda: return !id(boot_testing);
          then:
            - if:
                condition:
                  binary_sensor.is_on: claude_attention
                then:
                  - light.turn_on:
                      id: lamp
                      red: 100%
                      green: 16%
                      blue: 8%
                      effect: Clignotement
                else:
                  - if:
                      condition:
                        binary_sensor.is_on: claude_active
                      then:
                        - light.turn_on:
                            id: lamp
                            red: 100%
                            green: 56%
                            blue: 12%
                            effect: Respiration
                      else:
                        - light.turn_off: lamp
